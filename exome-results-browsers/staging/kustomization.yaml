apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - frontendconfig.yaml
  - ingress.yaml
  - certificate.yaml
namePrefix: staging-
replicas:
  - name: exome-results-browsers
    count: 1
labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      environment: qa
      name: staging-exome-results-browsers
images:
  - name: exome-results-browsers
    newName: us-docker.pkg.dev/exac-gnomad/gnomad/exome-results-browsers
    newTag: 14f3bd4-asc2-demo-2026-09-10--11-30
patches:
  - patch: |-
      kind: Deployment
      apiVersion: apps/v1
      metadata:
        name: exome-results-browsers
      spec:
        template:
          spec:
            volumes:
              - name: data
                gcePersistentDisk:
                  pdName: erb-data-asc2-demo-2026-09-09--19-54
